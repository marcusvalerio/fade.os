<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>CORTEX.OS — trailer de lançamento</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #041723; }
      #main { width: 100%; height: 100%; position: relative; background: #041723; }
      /* the Landing hero's own light: a Kahu Blue radial, top right */
      #main .glow { position: absolute; inset: 0; background: radial-gradient(circle at 84% 8%, rgba(0, 147, 214, 0.16), rgba(0, 147, 214, 0) 55%); opacity: 0; }
      #main .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- generated by build.mjs from trailer.config.mjs — edit the config, then `node build.mjs` -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="15.000" data-width="1920" data-height="1080">
      <div class="glow clip" id="glow" data-start="0" data-duration="15.000" data-track-index="0"></div>
      <div class="scene" id="f01-identidade" data-composition-id="f01-identidade" data-composition-src="compositions/frames/01-identidade.html" data-start="0.000" data-duration="2.150" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div class="scene" id="f02-sistema" data-composition-id="f02-sistema" data-composition-src="compositions/frames/02-sistema.html" data-start="2.150" data-duration="2.750" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div class="scene" id="f03-agenda" data-composition-id="f03-agenda" data-composition-src="compositions/frames/03-agenda.html" data-start="4.900" data-duration="3.150" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div class="scene" id="f04-profundidade" data-composition-id="f04-profundidade" data-composition-src="compositions/frames/04-profundidade.html" data-start="8.050" data-duration="3.000" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div class="scene" id="f05-cortex" data-composition-id="f05-cortex" data-composition-src="compositions/frames/05-cortex.html" data-start="11.050" data-duration="3.950" data-track-index="1" data-width="1920" data-height="1080"></div>
      <audio id="score" src="assets/trailer.wav" data-start="0" data-duration="15.000" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const glow = document.getElementById("glow");
      const keys = [[0,0],[0.1,0],[1.4,1],[1.45,1],[2.15,0],[12.1,0],[14,1]];
      tl.set(glow, { opacity: 0 }, 0);
      for (let i = 1; i < keys.length; i++) if (keys[i][1] !== keys[i - 1][1])
        tl.fromTo(glow, { opacity: keys[i - 1][1] }, { opacity: keys[i][1], duration: keys[i][0] - keys[i - 1][0], ease: "power1.inOut", immediateRender: false }, keys[i - 1][0]);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
